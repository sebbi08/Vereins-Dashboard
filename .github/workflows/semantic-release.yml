name: Semantic Release

on:
  workflow_dispatch:

concurrency:
  group: semantic-release
  cancel-in-progress: false

# Each job gets only what it needs (see the job-level permissions below)
permissions: {}

jobs:
  release:
    # Releases are only cut from master; a manual run on another branch is skipped
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the CI run of this commit
      contents: write # tag and GitHub release
      issues: write # semantic-release comments on released issues
      pull-requests: write # and pull requests
    outputs:
      released_version: ${{ steps.get-version.outputs.version }}
      new_release: ${{ steps.check-release.outputs.new_release }}

    steps:
      # Only release a commit whose CI run (lint, unit, integration and e2e tests) succeeded.
      # A CI run that is still in progress is waited for.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run found for $GITHUB_SHA. Push the commit and let CI finish before releasing."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null
          CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI run $RUN_ID for $GITHUB_SHA finished with '$CONCLUSION'. Not releasing."
            exit 1
          fi
          echo "CI run $RUN_ID for $GITHUB_SHA succeeded."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture current latest tag
        id: prev-tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Get released version
        id: get-version
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Check if new release was created
        id: check-release
        run: |
          if [[ "${{ steps.get-version.outputs.version }}" != "${{ steps.prev-tag.outputs.tag }}" && -n "${{ steps.get-version.outputs.version }}" ]]; then
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: release
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER_LOWER}/mv-dashboard" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.released_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.released_version }}
            PRIMEUI_LICENSE=${{ vars.PRIMEUI_LICENSE }}
