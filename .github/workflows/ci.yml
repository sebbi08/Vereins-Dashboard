name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BACKEND_URL: http://localhost:3996
      E2E_FRONTEND_URL: http://localhost:5179
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Invoice templates (.docx) are rendered to PDF with LibreOffice
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Build shared and frontend
        run: |
          npm run build --workspace=shared
          npm run build --workspace=frontend

      # Throwaway backend + production frontend; every spec resets this backend's data
      - name: Start servers
        run: |
          PORT=3996 DATABASE_URL="file:${RUNNER_TEMP}/e2e.sqlite" DATA_DIR="${RUNNER_TEMP}/e2e-data" \
            E2E_RESET_ENABLED=true \
            nohup npm run dev --workspace=backend > "${RUNNER_TEMP}/backend.log" 2>&1 &
          VITE_API_TARGET=http://localhost:3996 \
            nohup npx --workspace=frontend vite preview --port 5179 --strictPort > "${RUNNER_TEMP}/frontend.log" 2>&1 &

      - name: E2E tests
        working-directory: e2e
        run: npx wdio run wdio.conf.ts

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log

  # Builds the production image and starts it, so a broken Dockerfile fails CI before a release
  # (the release workflow only runs for commits whose CI run succeeded).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=ci --tag mv-dashboard:ci .

      - name: Start container
        run: |
          mkdir -p "${RUNNER_TEMP}/data"
          chmod 777 "${RUNNER_TEMP}/data"
          docker run --detach --name mv-dashboard -p 3995:3000 \
            -v "${RUNNER_TEMP}/data:/app/data" mv-dashboard:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3995/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::The container did not become healthy"
          exit 1

      - name: Smoke-test the running image
        run: |
          curl -fsS http://localhost:3995/ | grep -qi '<div id="app"' \
            || { echo "::error::The frontend is not served"; exit 1; }
          test -f "${RUNNER_TEMP}/data/db.sqlite" \
            || { echo "::error::No database was created on the data volume"; exit 1; }
          docker exec mv-dashboard sh -c \
            'find /usr/share/fonts -iname "*carlito*" | grep -q . && find /usr/share/fonts -iname "*liberation*" | grep -q .' \
            || { echo "::error::Template fonts are missing in the image"; exit 1; }
          docker exec mv-dashboard sh -c 'libreoffice --version'

      - name: Container logs
        if: always()
        run: docker logs mv-dashboard || true
