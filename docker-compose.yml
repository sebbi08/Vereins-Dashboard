services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/CHANGE_ME/mv-dashboard:latest}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - db-data:/app/data
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/db.sqlite}
      PORT: "3000"
      DATA_DIR: ${DATA_DIR:-/app/data}
    restart: unless-stopped

volumes:
  db-data:
