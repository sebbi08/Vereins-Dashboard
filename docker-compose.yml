services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: file:/app/dev-data/db.sqlite
      DATA_DIR: /app/dev-data
      PORT: 3000
      NODE_ENV: development
      # Local test stack only: lets the e2e suite wipe this stack's data. Never set in production.
      E2E_RESET_ENABLED: 'true'
    command: npm run dev --workspace=backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
    working_dir: /app
    environment:
      VITE_API_TARGET: http://backend:3000
    command: npm run dev --workspace=frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
