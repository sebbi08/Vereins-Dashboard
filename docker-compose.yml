services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      DATABASE_URL: file:/app/dev-data/db.sqlite
      DATA_DIR: /app/dev-data
      PORT: 3000
      NODE_ENV: development
    command: npm run dev --workspace=backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      VITE_API_TARGET: http://backend:3000
    command: npm run dev --workspace=frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
